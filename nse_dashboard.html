<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSE Momentum Scanner — Trading Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
:root{
  --bg0:#080d18;--bg1:#0e1525;--bg2:#141e33;--bg3:#1a2540;--bg4:#20304e;
  --border:#1e2d47;--border2:#2a3d5c;
  --text1:#e8edf5;--text2:#8fa3c0;--text3:#56708c;
  --green:#10b981;--green2:#064e3b;--green3:#d1fae5;
  --red:#ef4444;--red2:#450a0a;--red3:#fecaca;
  --amber:#f59e0b;--amber2:#451a03;--amber3:#fef3c7;
  --blue:#3b82f6;--blue2:#1e3a8a;--blue3:#dbeafe;
  --purple:#8b5cf6;--cyan:#06b6d4;
  --r:8px;--r2:12px;
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg0);color:var(--text1);font-family:var(--font);font-size:13px;min-height:100vh}
a{color:var(--blue);text-decoration:none}

/* ── Layout ── */
.hdr{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 20px;height:56px;
     display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.hdr-logo{font-size:15px;font-weight:600;letter-spacing:-.3px;color:var(--text1)}
.hdr-logo span{color:var(--blue)}
.hdr-meta{font-size:12px;color:var(--text3);margin-left:auto;display:flex;gap:20px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge-green{background:var(--green2);color:var(--green)}
.badge-red{background:var(--red2);color:var(--red)}
.badge-amber{background:var(--amber2);color:var(--amber)}
.badge-blue{background:var(--blue2);color:var(--blue)}
.badge-gray{background:var(--bg3);color:var(--text2)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.wrap{padding:20px;max-width:1600px;margin:0 auto}

/* ── Cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.card-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.card-value{font-size:26px;font-weight:600;line-height:1}
.card-sub{font-size:11px;color:var(--text3);margin-top:4px}
.card-green .card-value{color:var(--green)}
.card-red .card-value{color:var(--red)}
.card-amber .card-value{color:var(--amber)}
.card-blue .card-value{color:var(--blue)}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;background:var(--bg1);border:1px solid var(--border);
      border-radius:var(--r);padding:4px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;
     color:var(--text3);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--text1);background:var(--bg3)}
.tab.active{background:var(--bg3);color:var(--text1);border:1px solid var(--border2)}
.tab-count{background:var(--bg4);color:var(--text2);padding:1px 6px;border-radius:10px;font-size:10px}
.panel{display:none}.panel.active{display:block}

/* ── Tables ── */
.tbl-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.tbl-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
          border-bottom:1px solid var(--border);background:var(--bg2)}
.tbl-title{font-size:13px;font-weight:500}
.tbl-search{background:var(--bg3);border:1px solid var(--border);color:var(--text1);
            padding:6px 10px;border-radius:6px;font-size:12px;width:200px;outline:none}
.tbl-search::placeholder{color:var(--text3)}
table{width:100%;border-collapse:collapse}
th{padding:9px 10px;text-align:left;font-size:11px;font-weight:500;color:var(--text3);
   border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;background:var(--bg2);
   text-transform:uppercase;letter-spacing:.4px}
th:hover{color:var(--text1)}
th .sort-icon{opacity:.4;margin-left:3px;font-size:10px}
th.sorted .sort-icon{opacity:1;color:var(--blue)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2);cursor:pointer}
.tr-buy:hover td{background:rgba(16,185,129,.06)}
.tr-sell:hover td{background:rgba(239,68,68,.06)}
.tr-sel td{background:rgba(59,130,246,.08)}

/* ── TF Signal dots ── */
.tf-dots{display:flex;gap:4px;align-items:center}
.tf-dot{width:14px;height:14px;border-radius:50%;font-size:8px;font-weight:700;
        display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.tf-bull{background:var(--green)}
.tf-bear{background:var(--red)}
.tf-neut{background:var(--bg4);color:var(--text3)}

/* ── Score bar ── */
.score-bar{display:flex;align-items:center;gap:6px}
.score-num{font-weight:600;font-size:13px;width:42px;text-align:right}
.bar-outer{width:70px;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.bar-inner{height:100%;border-radius:3px;transition:width .3s}

/* ── Price bar (52w context) ── */
.price-bar-wrap{display:flex;align-items:center;gap:6px}
.price-bar-outer{width:80px;height:6px;background:var(--bg4);border-radius:3px;position:relative}
.price-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--amber),var(--green))}
.price-bar-cursor{position:absolute;top:-2px;width:2px;height:10px;background:var(--text1);border-radius:1px}
.price-pct{font-size:11px;width:46px;text-align:right}

/* ── Level cells ── */
.level-pair{display:flex;flex-direction:column;gap:1px}
.level-h{color:var(--green);font-size:11px}
.level-l{color:var(--red);font-size:11px}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;
               align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg1);border:1px solid var(--border2);border-radius:var(--r2);
       width:100%;max-width:900px;max-height:90vh;overflow-y:auto}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;
           position:sticky;top:0;background:var(--bg1);z-index:1}
.modal-sym{font-size:18px;font-weight:600}
.modal-body{padding:20px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.modal-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.modal-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.modal-section-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;
                      letter-spacing:.6px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:4px 0;
    border-bottom:1px solid var(--border);font-size:12px}
.kv:last-child{border-bottom:none}
.kv-key{color:var(--text3)}
.kv-val{font-weight:500}
.score-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0}
.score-component{font-size:11px;color:var(--text2);width:80px}
.score-component-bar{flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin:0 10px}
.score-component-fill{height:100%;border-radius:4px}
.score-component-val{font-size:11px;font-weight:600;width:36px;text-align:right}

/* ── Level meter ── */
.level-meter{position:relative;height:28px;border-radius:4px;
             background:linear-gradient(90deg,var(--red2),var(--amber2),var(--green2));
             border:1px solid var(--border);margin:8px 0}
.level-needle{position:absolute;top:2px;width:4px;height:24px;background:var(--text1);
              border-radius:2px;transform:translateX(-50%)}
.level-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:2px}

/* ── Supertrend summary ── */
.st-box{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st-metric{background:var(--bg3);border-radius:var(--r);padding:10px;text-align:center}
.st-metric-label{font-size:10px;color:var(--text3);margin-bottom:4px}
.st-metric-val{font-size:14px;font-weight:600}
.st-metric-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* ── Matrix grid ── */
.matrix-grid{display:grid;gap:1px;background:var(--border)}
.matrix-cell{padding:8px 6px;text-align:center;font-size:11px;font-weight:500;transition:opacity .2s}
.matrix-cell:hover{opacity:.8}
.matrix-header{background:var(--bg2);color:var(--text3);font-size:10px;padding:8px 6px}

/* ── Misc ── */
.section-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text1);
               display:flex;align-items:center;gap:8px}
.sep{height:1px;background:var(--border);margin:16px 0}
.empty{padding:40px;text-align:center;color:var(--text3)}
.close-btn{margin-left:auto;background:none;border:none;color:var(--text3);cursor:pointer;
           padding:4px;border-radius:4px;display:flex;align-items:center}
.close-btn:hover{color:var(--text1);background:var(--bg3)}
.chart-wrap{position:relative;width:100%;height:200px}
.rec-buy{color:var(--green);font-weight:600}
.rec-sell{color:var(--red);font-weight:600}
.rec-hold{color:var(--text3)}
.sym-link{color:var(--text1);font-weight:500;font-size:12px}
.rank-badge{width:22px;height:22px;border-radius:50%;background:var(--bg3);color:var(--text2);
            font-size:10px;display:flex;align-items:center;justify-content:center}

/* ── v4.0: regime banner + quality badges ── */
.regime-banner{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--bg1);
               border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.regime-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.regime-bullish{background:var(--green2);color:var(--green)}
.regime-bearish{background:var(--red2);color:var(--red)}
.regime-neutral{background:var(--amber2);color:var(--amber)}
.regime-stat{font-size:11px;color:var(--text2)}
.regime-stat b{color:var(--text1);font-weight:600}
.mini-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;letter-spacing:.3px}
.mini-badge-warn{background:var(--amber2);color:var(--amber)}
.mini-badge-bad{background:var(--red2);color:var(--red)}
.gate-reason{font-size:10px;color:var(--text3);font-style:italic}
@media(max-width:700px){.modal-grid{grid-template-columns:1fr}.modal-grid3{grid-template-columns:1fr 1fr}.hdr-meta{display:none}}
</style>
</head>
<body>

<!-- ─── Header ─────────────────────────────────────────────────── -->
<header class="hdr">
  <i class="ti ti-chart-candle" style="font-size:20px;color:var(--blue)"></i>
  <div class="hdr-logo">NSE <span>Momentum</span> Scanner</div>
  <span class="badge badge-green"><span class="dot"></span>Live</span><span id="live-source" class="badge badge-blue" style="font-size:10px">Demo data</span>
  <div class="hdr-meta">
    <span id="hdr-session"></span>
    <span id="hdr-date"></span>
    <span id="hdr-universe"></span>
  </div>
</header>

<!-- ─── Live-data diagnostic banner (hidden unless something needs attention) ── -->
<div id="live-banner" style="display:none;background:var(--amber2);color:var(--amber);
     font-size:12px;padding:8px 16px;text-align:center;border-bottom:1px solid var(--amber)"></div>

<!-- ─── Main wrap ───────────────────────────────────────────────── -->
<div class="wrap">

  <!-- v4.0: Market regime banner -->
  <div id="regime-banner"></div>

  <!-- Summary cards -->
  <div class="cards" id="summary-cards"></div>

  <!-- Tabs -->
  <div class="tabs" id="tabs"></div>

  <!-- Panels -->
  <div id="panel-dashboard" class="panel active"></div>
  <div id="panel-buy"       class="panel"></div>
  <div id="panel-sell"      class="panel"></div>
  <div id="panel-matrix"    class="panel"></div>
  <div id="panel-levels"    class="panel"></div>
  <div id="panel-supertrend"class="panel"></div>
</div>

<!-- ─── Stock Detail Modal ──────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  MOCK DATA  (mirrors SQLite aggregated_results + scan_results)
// ═══════════════════════════════════════════════════════════════
const SCAN_DATE = "2026-06-03";
const SESSION = {id:42, runDate:"2026-06-03", total:487, scored:471};
const rnd=(lo,hi,dp=1)=>parseFloat((lo+Math.random()*(hi-lo)).toFixed(dp));
Math.seedrandom = function(s){let x=s;return()=>{x=Math.sin(x)*10000;return x-Math.floor(x)}};
let rng=0;
const sr=()=>{rng=Math.sin(rng*9301+49297)%1;return Math.abs(rng)};
const srnd=(lo,hi,dp=1)=>parseFloat((lo+sr()*(hi-lo)).toFixed(dp));

function mkStock(sym, close, aggScore, stDays, vcpFlag, sector) {
  sr(); // advance seed
  const bull = aggScore > 0;
  const sp   = close * 0.20;
  const yL   = +(close - sp * srnd(.6,1.0)).toFixed(2);
  const yH   = +(close + sp * srnd(.15,.6)).toFixed(2);
  const mL   = +(close - sp * srnd(.12,.32)).toFixed(2);
  const mH   = +(close + sp * srnd(.01,.14)).toFixed(2);
  const qL   = +(close - sp * srnd(.30,.52)).toFixed(2);
  const qH   = +(close + sp * srnd(.08,.28)).toFixed(2);
  const wL   = +(close - sp * srnd(.03,.09)).toFixed(2);
  const wH   = +(close + sp * srnd(.01,.05)).toFixed(2);

  const noise  = ()=>+srnd(-14,14,0);
  const moSc   = Math.round(Math.min(100,Math.max(-80,aggScore*.70+noise())));
  const wSc    = Math.round(Math.min(100,Math.max(-80,aggScore*.85+noise())));
  const dSc    = Math.round(Math.min(100,Math.max(-80,aggScore*1.05+noise())));
  const hSc    = Math.round(Math.min(100,Math.max(-80,aggScore*.90+noise())));
  const m15Sc  = Math.round(Math.min(100,Math.max(-80,aggScore*.92+noise())));
  const m5Sc   = Math.round(Math.min(100,Math.max(-80,aggScore*.78+noise())));
  const bullTf = [moSc,wSc,dSc,hSc,m15Sc,m5Sc].filter(s=>s>0).length;

  const adx = bull ? srnd(22,48,1) : srnd(18,42,1);
  const pdi = bull ? srnd(24,44,1) : srnd(11,24,1);
  const mdi = bull ? srnd(10,23,1) : srnd(25,47,1);

  const flipDate = new Date(SCAN_DATE);
  flipDate.setDate(flipDate.getDate() - stDays);
  const flip = flipDate.toISOString().split('T')[0];

  const stHH = +(bull ? mH + srnd(0,close*.03) : mH + srnd(0,close*.015)).toFixed(2);
  const stLL = +(bull ? mL - srnd(0,close*.015) : mL - srnd(0,close*.04)).toFixed(2);
  const stHL = +(mL + srnd(.01,.04)*close).toFixed(2);
  const stLH = +(mH - srnd(.01,.04)*close).toFixed(2);

  const sSt  = bull ? 30 : -30;
  const sHma = aggScore>20 ? 15 : aggScore<-20 ? -15 : +srnd(-8,8,0);
  const sAdx = adx>21 ? (pdi>mdi?15:-15) : 0;
  const sVcp = vcpFlag ? 15 : 0;
  const sVol = bull ? (srnd(0,1)>.4 ? 15 : srnd(-2,8,0)) : (srnd(0,1)>.4 ? -7 : srnd(-5,3,0));
  const sTr  = bull ? 10 : -10;
  const volR = bull ? +srnd(1.1,3.5,2) : +srnd(0.4,1.3,2);
  const vol  = +(close * srnd(50000,2000000,0));
  const avgVol = +(vol / volR);

  // ── v4.0 demo fields: RS rank, liquidity, extension, ATR stop/target ──
  const rsRank = bull ? Math.round(srnd(55,99)) : Math.round(srnd(1,60));
  const avgTurnover = avgVol * close;
  const isLiquid = avgTurnover >= 50000000;
  const extensionPct = bull ? +srnd(-4,30,1) : +srnd(-20,8,1);
  const isExtended = extensionPct > 25;
  const atr = +(close * srnd(0.015,0.045)).toFixed(2);
  const suggestedStop = +(close - atr*2.5).toFixed(2);
  const suggestedTarget = +(close + atr*2.5*2.5).toFixed(2);
  const gateReasons=[];
  if(bull && rsRank<70) gateReasons.push('weak RS vs Nifty');
  if(bull && !isLiquid) gateReasons.push('low liquidity');
  if(bull && isExtended) gateReasons.push('extended from 50-EMA');
  const gateReason = (aggScore>=20 && aggScore<40 && gateReasons.length) ? gateReasons.join(', ') : '';

  // ── v4.1 demo fields: sector rank, fundamentals, earnings blackout ──
  const sectorRank = Math.round(srnd(1,99));
  const hasFundamentals = srnd(0,1) > 0.35; // most demo names have data; some don't, to show the "unknown" path
  const fundamentals = hasFundamentals ? {
    pe: +srnd(8,65,1), roePct: +srnd(-5,35,1), debtToEquity: +srnd(0,2.5,2),
    epsGrowthPct: +srnd(-15,45,1), promoterPledgePct: +srnd(0,1)>0.8 ? +srnd(10,70,1) : 0,
    hasData: true,
  } : {pe:null,roePct:null,debtToEquity:null,epsGrowthPct:null,promoterPledgePct:null,hasData:false};
  const hasUpcomingEarnings = srnd(0,1) > 0.85;
  const earningsDaysOut = Math.floor(srnd(-2, 45));
  const nextEarningsDate = hasUpcomingEarnings
    ? new Date(Date.now() + earningsDaysOut*86400000).toISOString().slice(0,10) : null;
  const inEarningsBlackout = hasUpcomingEarnings && earningsDaysOut >= 0 && earningsDaysOut <= 3;

  return {
    sym, close, aggScore, moSc, wSc, dSc, hSc, m15Sc, m5Sc, bullTf, bearTf:6-bullTf, sector,
    levels:{wH,wL,mH,mL,qH,qL,yH,yL,
            p52H:+((close-yH)/yH*100).toFixed(2),
            p52L:+((close-yL)/yL*100).toFixed(2),
            pMH:+((close-mH)/mH*100).toFixed(2),
            pWH:+((close-wH)/wH*100).toFixed(2)},
    st:{bull,days:stDays,flip,
        hh:stHH,hhAgo:Math.floor(srnd(1,Math.max(2,stDays*.4))),
        hl:stHL,hlAgo:Math.floor(srnd(1,Math.max(2,stDays*.5))),
        lh:stLH,lhAgo:Math.floor(srnd(1,Math.max(2,stDays*.6))),
        ll:stLL,llAgo:Math.floor(srnd(1,Math.max(2,stDays*.8)))},
    adx,pdi,mdi,volR,vcp:vcpFlag,vol,avgVol,
    scores:{st:sSt,hma:sHma,adx:sAdx,vcp:sVcp,vol:sVol,tr:sTr},
    hmaFast:+(close*(1+srnd(-.005,.01))).toFixed(2),
    hmaSlow:+(close*(1-srnd(.002,.012))).toFixed(2),
    emaFast:+(close*(1+srnd(-.003,.008))).toFixed(2),
    emaSlow:+(close*(1-srnd(.003,.015))).toFixed(2),
    rsRank, avgTurnover, isLiquid, extensionPct, isExtended, atr, suggestedStop, suggestedTarget, gateReason,
    sectorRank, fundamentals, nextEarningsDate, inEarningsBlackout,
    rec: aggScore>=40?"BUY": aggScore<=-30?"IMMEDIATE_SELL":"HOLD"
  };
}

const STOCKS = [
  // ── TOP 30 BUYS ──
  mkStock("RELIANCE.NS",   2456.70, 87.5, 23, true,  "Energy"),
  mkStock("TCS.NS",         4012.50, 82.0, 45, false, "IT"),
  mkStock("BHARTIARTL.NS", 1923.45, 79.5, 31, true,  "Telecom"),
  mkStock("HDFCBANK.NS",   1680.25, 77.0, 18, false, "Banking"),
  mkStock("ICICIBANK.NS",  1378.90, 75.5, 14, false, "Banking"),
  mkStock("INFY.NS",        1892.40, 73.0, 27, true,  "IT"),
  mkStock("BAJFINANCE.NS", 7456.80, 71.5, 12, true,  "NBFC"),
  mkStock("TITAN.NS",       3890.25, 70.0, 35, false, "Consumer"),
  mkStock("LT.NS",          3890.40, 68.5, 22, false, "Infra"),
  mkStock("KOTAKBANK.NS",  2123.45, 67.0, 19, false, "Banking"),
  mkStock("HAL.NS",         4890.60, 65.5, 41, true,  "Defense"),
  mkStock("SBIN.NS",         834.60, 64.0, 16, false, "Banking"),
  mkStock("SUNPHARMA.NS",  1789.50, 63.0, 29, false, "Pharma"),
  mkStock("AXISBANK.NS",   1245.30, 62.5, 11, false, "Banking"),
  mkStock("PERSISTENT.NS", 5678.90, 61.0, 33, true,  "IT"),
  mkStock("HCLTECH.NS",    2034.10, 60.5, 25, false, "IT"),

const fNum=(n,dp=2)=>n==null?"—":parseFloat(n).toLocaleString('en-IN',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const fPct=(n)=>n==null?"—":(n>=0?"+":"")+parseFloat(n).toFixed(2)+"%";
const fInt=(n)=>n==null?"—":Math.round(n).toLocaleString('en-IN');
const esc=s=>(s||"").toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function scoreColor(s){
  if(s>=50)return'var(--green)';
  if(s>=20)return'#84cc16';
  if(s>=-10)return'var(--amber)';
  if(s>=-40)return'#f97316';
  return'var(--red)';
}
function scoreBarHtml(score,maxAbs=100){
  const pct = Math.min(100,Math.abs(score)/maxAbs*100);
  const c = scoreColor(score);
  return `<div class="score-bar">
    <span class="score-num" style="color:${c}">${score>0?'+':''}${score}</span>
    <div class="bar-outer"><div class="bar-inner" style="width:${pct}%;background:${c}"></div></div>
  </div>`;
}
function tfDotsHtml(s){
  const labels=['M','W','D','H','15','5'];
  const scores=[s.moSc,s.wSc,s.dSc,s.hSc,s.m15Sc,s.m5Sc];
  return `<div class="tf-dots">${labels.map((l,i)=>{
    const sc=scores[i];
    const cls=sc>10?'tf-bull':sc<-10?'tf-bear':'tf-neut';
    return`<div class="tf-dot ${cls}" title="${l}: ${sc>0?'+':''}${sc}">${l[0]}</div>`;
  }).join('')}</div>`;
}
function priceMeterHtml(s){
  const {yL,yH,p52H,p52L}=s.levels;
  const pct=Math.max(0,Math.min(100,(s.close-yL)/(yH-yL)*100));
  const c=pct>70?'var(--green)':pct>40?'var(--amber)':'var(--red)';
  return`<div class="price-bar-wrap">
    <span class="price-pct" style="color:${c};font-size:11px">${fPct(p52H)}</span>
    <div class="price-bar-outer">
      <div class="price-bar-fill" style="width:100%"></div>
      <div class="price-bar-cursor" style="left:${pct}%"></div>
    </div>
  </div>`;
}
function recBadge(rec){
  if(rec==="BUY") return`<span class="badge badge-green"><i class="ti ti-trending-up"></i>BUY</span>`;
  if(rec==="IMMEDIATE_SELL") return`<span class="badge badge-red"><i class="ti ti-trending-down"></i>SELL</span>`;
  return`<span class="badge badge-gray">HOLD</span>`;
}

function sortableTable(panelId, stocks, type, columns, rowFn){
  let sortCol=0, sortAsc=false;
  const panel=document.getElementById(panelId);
  function render(list, query=''){
    const filtered=query ? list.filter(s=>s.sym.toLowerCase().includes(query.toLowerCase())||s.sector.toLowerCase().includes(query.toLowerCase())) : list;
    const sorted=[...filtered].sort((a,b)=>{
      const va=columns[sortCol].val(a), vb=columns[sortCol].val(b);
      return typeof va==='string'?(va<vb?-1:va>vb?1:0)*( sortAsc?1:-1)
                                 :(va-vb)*(sortAsc?1:-1);
    });
    panel.innerHTML=`
      <div class="tbl-wrap">
        <div class="tbl-head">
          <span class="tbl-title">${type==='buy'?
            `<span style="color:var(--green)"><i class="ti ti-trending-up"></i> Top ${BUYS.length} Buy Candidates</span>`:
            `<span style="color:var(--red)"><i class="ti ti-trending-down"></i> Top ${SELLS.length} Immediate Sells</span>`}</span>
          <input class="tbl-search" placeholder="Search symbol / sector…" id="search-${panelId}" value="${query}">
        </div>
        <div style="overflow-x:auto"><table>
          <thead><tr>${columns.map((c,i)=>`
            <th class="${i===sortCol?'sorted':''}" data-col="${i}">${c.label}
              <span class="sort-icon">${i===sortCol?(sortAsc?'↑':'↓'):'↕'}</span></th>`).join('')}
          </tr></thead>
          <tbody>${sorted.map(s=>`<tr class="tr-${type}" onclick="openModal('${esc(s.sym)}')">${rowFn(s)}</tr>`).join('')}</tbody>
        </table></div>
        <div style="padding:8px 16px;font-size:11px;color:var(--text3)">
          ${sorted.length} of ${list.length} stocks  · Click any row for full detail
        </div>
      </div>`;
    panel.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
      const c=+th.dataset.col;
      if(sortCol===c) sortAsc=!sortAsc; else{sortCol=c;sortAsc=false;}
      render(list, document.getElementById('search-'+panelId)?.value||'');
    }));
    document.getElementById('search-'+panelId)?.addEventListener('input',e=>render(list,e.target.value));
  }
  render(stocks);
}

function openModal(sym){
  const s=STOCKS.find(x=>x.sym===sym); if(!s) return;
  const m=s.st, L=s.levels;
  const pct52=(s.close-L.yL)/(L.yH-L.yL)*100;
  const pctMo=(s.close-L.mL)/(L.mH-L.mL)*100;
  const pctWk=(s.close-L.wL)/(L.wH-L.wL)*100;
  const maxScores={st:30,hma:15,adx:15,vcp:15,vol:15,tr:10};

            <div class="st-metric-sub" style="color:${s.sectorRank>=70?'var(--green)':s.sectorRank>=40?'var(--amber)':'var(--red)'}">
              Rank ${Math.round(s.sectorRank)}/99</div>
          </div>
          <div class="st-metric">
            <div class="st-metric-label">P/E</div>
            <div class="st-metric-val">${s.fundamentals.hasData && s.fundamentals.pe!=null ? s.fundamentals.pe.toFixed(1) : '—'}</div>
            <div class="st-metric-sub">${s.fundamentals.hasData?'':'no data'}</div>
          </div>
          <div class="st-metric">
            <div class="st-metric-label">ROE</div>
            <div class="st-metric-val" style="color:${s.fundamentals.roePct!=null && s.fundamentals.roePct<10?'var(--amber)':'var(--text1)'}">
              ${s.fundamentals.hasData && s.fundamentals.roePct!=null ? s.fundamentals.roePct.toFixed(1)+'%' : '—'}</div>
            <div class="st-metric-sub">${s.fundamentals.hasData?'':'no data'}</div>
          </div>
          <div class="st-metric">
            <div class="st-metric-label">Debt/Equity</div>
            <div class="st-metric-val" style="color:${s.fundamentals.debtToEquity!=null && s.fundamentals.debtToEquity>2?'var(--amber)':'var(--text1)'}">
              ${s.fundamentals.hasData && s.fundamentals.debtToEquity!=null ? s.fundamentals.debtToEquity.toFixed(2) : '—'}</div>
            <div class="st-metric-sub">${s.fundamentals.hasData?'':'no data'}</div>
          </div>
          <div class="st-metric">
            <div class="st-metric-label">Next Earnings</div>
            <div class="st-metric-val" style="font-size:13px;color:${s.inEarningsBlackout?'var(--amber)':'var(--text1)'}">
              ${s.nextEarningsDate ? s.nextEarningsDate : '—'}</div>
            <div class="st-metric-sub">${s.inEarningsBlackout?'blackout window':''}</div>
          </div>
        </div>
        ${!s.fundamentals.hasData?`<div style="margin-top:10px;font-size:11px;color:var(--text3)">
          <i class="ti ti-info-circle"></i> No fundamentals on file for this symbol — add a row to data/reference.csv to populate.</div>`:''}
      </div>

      <!-- Row 2: Price levels -->
      <div class="modal-section" style="margin-bottom:16px">
        <div class="modal-section-title">Price Level Context</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
          ${[
            {label:'52-Week Range',lo:L.yL,hi:L.yH,pct:pct52,tag:'52wH/L'},
            {label:'Monthly Range',lo:L.mL,hi:L.mH,pct:pctMo,tag:'MoH/L'},
            {label:'Weekly Range',lo:L.wL,hi:L.wH,pct:pctWk,tag:'WkH/L'},
          ].map(r=>`<div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px">${r.label}</div>
            <div class="level-meter">
              <div class="level-needle" style="left:${Math.max(0,Math.min(100,r.pct))}%"></div>
            </div>
            <div class="level-labels">
              <span>₹${fNum(r.lo,0)}</span>
              <span style="color:${r.pct>60?'var(--green)':r.pct>30?'var(--amber)':'var(--red)'}">
                ${r.pct.toFixed(0)}%</span>
              <span>₹${fNum(r.hi,0)}</span>
            </div>
          </div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px">
          ${[
            {l:'vs 52w High',v:L.p52H,good:v=>v>=-5},
            {l:'vs 52w Low', v:L.p52L,good:v=>v>20},
            {l:'vs Mo High', v:L.pMH, good:v=>v>=-3},
            {l:'vs Wk High', v:L.pWH, good:v=>v>=-2},
          ].map(x=>`<div style="background:var(--bg3);border-radius:var(--r);padding:10px;text-align:center">
            <div style="font-size:10px;color:var(--text3);margin-bottom:4px">${x.l}</div>
            <div style="font-size:16px;font-weight:600;color:${x.good(x.v)?'var(--green)':'var(--amber)'}">
              ${fPct(x.v)}</div>
          </div>`).join('')}
        </div>
      </div>

      <!-- Row 3: Supertrend metrics -->
      <div class="modal-section" style="margin-bottom:16px">
        <div class="modal-section-title">Supertrend Analysis (Daily)</div>
        <div class="st-box" style="margin-bottom:12px">
          <div class="st-metric">
            <div class="st-metric-label">Direction</div>
            <div class="st-metric-val" style="color:${m.bull?'var(--green)':'var(--red)'}">
              ${m.bull?'▲ BULL':'▼ BEAR'}</div>
          </div>
          <div class="st-metric">
            <div class="st-metric-label">Days in trend</div>
            <div class="st-metric-val" style="color:${m.bull?'var(--green)':'var(--red)'}">${m.days}d</div>
            <div class="st-metric-sub">since flip</div>
          </div>
          <div class="st-metric">
            <div class="st-metric-label">Last flip date</div>
            <div class="st-metric-val" style="font-size:12px">${m.flip}</div>
          </div>
          <div class="st-metric">
            <div class="st-metric-label">ST value</div>
            <div class="st-metric-val">₹${fNum(m.bull?m.ll:m.hh)}</div>
            <div class="st-metric-sub">${m.bull?'support':'resistance'}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
          ${[
            {l:'Highest High',v:m.hh,ago:m.hhAgo,c:'var(--green)',tip:'Peak since flip — resistance / target'},
            {l:'Highest Low', v:m.hl,ago:m.hlAgo,c:'#84cc16',    tip:'Rising lows = healthy bull'},
            {l:'Lowest High', v:m.lh,ago:m.lhAgo,c:'var(--amber)',tip:'Falling highs = weakening bull'},
            {l:'Lowest Low',  v:m.ll,ago:m.llAgo,c:'var(--red)',  tip:'Trough — support / stop region'},
          ].map(x=>`<div style="background:var(--bg3);border-radius:var(--r);padding:12px" title="${x.tip}">
            <div style="font-size:10px;color:var(--text3);margin-bottom:6px">${x.l}</div>
            <div style="font-size:15px;font-weight:600;color:${x.c}">₹${fNum(x.v)}</div>
            <div style="font-size:10px;color:var(--text3);margin-top:3px">${x.ago}d ago</div>
            <div style="margin-top:6px;height:3px;border-radius:2px;background:${x.c};opacity:.4"></div>
          </div>`).join('')}
        </div>
      </div>

      <!-- Row 4: Multi-TF scores chart -->
      <div class="modal-section">
        <div class="modal-section-title">Timeframe Score Breakdown</div>
        <div class="chart-wrap" style="height:160px">
          <canvas id="modal-chart" role="img" aria-label="Bar chart of scores per timeframe for ${esc(s.sym)}"></canvas>
        </div>
      </div>

      <!-- Quick actions -->
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <a href="https://www.nseindia.com/get-quotes/equity?symbol=${encodeURIComponent(s.sym.replace('.NS',''))}"
           target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
           background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--text1);font-size:12px">
          <i class="ti ti-external-link"></i> NSE Quote</a>
        <a href="https://finance.yahoo.com/chart/${encodeURIComponent(s.sym)}"
           target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
           background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--text1);font-size:12px">
          <i class="ti ti-chart-candle"></i> Yahoo Chart</a>
        <button onclick="navigator.clipboard.writeText('${esc(s.sym)}')" style="display:inline-flex;align-items:center;gap:6px;
           padding:8px 14px;background:var(--bg3);border:1px solid var(--border);
           border-radius:var(--r);color:var(--text1);font-size:12px;cursor:pointer">
          <i class="ti ti-copy"></i> Copy symbol</button>
      </div>
    </div>`;

  document.getElementById('modal-overlay').classList.add('open');

  setTimeout(()=>{
    const scores=[s.aggScore,s.moSc,s.wSc,s.dSc,s.hSc,s.m15Sc,s.m5Sc];
    const labels=['Composite','1 Month','1 Week','1 Day','1 Hour','15 Min','5 Min'];
    new Chart(document.getElementById('modal-chart'),{
      type:'bar',
      data:{labels,datasets:[{
        data:scores,
        backgroundColor:scores.map(v=>v>=40?'rgba(16,185,129,.8)':v>=0?'rgba(245,158,11,.7)':'rgba(239,68,68,.8)'),
        borderRadius:4,borderSkipped:false
      }]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
               plugins:{legend:{display:false}},
               scales:{x:{min:-100,max:100,grid:{color:'rgba(255,255,255,.05)'},
                          ticks:{color:'#56708c',font:{size:10}}},
                       y:{ticks:{color:'#8fa3c0',font:{size:11}}}}}
    });
  },80);
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}
document.addEventListener('keydown',e=>e.key==='Escape'&&closeModal());


// ═══════════════════════════════════════════════════════════════
//  DATA LOADER  — polls dashboard_data.json (live when served by
//  `dotnet run -- --serve`, otherwise a static snapshot or demo data)
// ═══════════════════════════════════════════════════════════════
const REFRESH_INTERVAL_MS = 30000;
let liveConnected = false;

async function loadAndRender() {
  // Opening the .html file directly (file://) means fetch() can never reach a live
  // server — this is the #1 cause of "dashboard is stuck on demo data" reports. Detect
  // it up front and say so plainly, instead of letting a silent network failure look
  // identical to "you just haven't run the scanner yet".
  if (location.protocol === 'file:') {
    showBanner('Opened as a local file, so live data can\'t load. Run <code>dotnet run -- --serve</code> ' +
                'in the project folder, then open the URL it prints (e.g. http://localhost:5080) instead of this file.');
    renderAll();
    return;
  }

  try {
    const resp = await fetch('dashboard_data.json', {cache:'no-store'});
    if (resp.ok) {
      const live = await resp.json();
      applyLiveData(live);
      liveConnected = true;
      setLiveStatus(true, live.scanDate);
      hideBanner();
      console.log('[Dashboard] Loaded live data from dashboard_data.json');
    } else {
      // Surface the server's actual reason (e.g. "No scan sessions found — run the
      // scanner first") instead of quietly sitting on demo data with no explanation.
      let detail = `HTTP ${resp.status}`;
      try {
        const body = await resp.json();
        if (body && (body.detail || body.title)) detail = body.detail || body.title;
      } catch { /* non-JSON error body — keep the HTTP status */ }
      setLiveStatus(false);
      if (!liveConnected) showBanner('Dashboard server is running, but couldn\'t load data: <b>' + esc(detail) +
                                       '</b>. If you haven\'t run a scan yet, run <code>dotnet run</code> first.');
      console.warn('[Dashboard] dashboard_data.json request failed:', detail);
    }
  } catch(e) {
    setLiveStatus(false);
    if (!liveConnected) {
      showBanner('Couldn\'t reach the dashboard server at this address. Make sure ' +
                  '<code>dotnet run -- --serve</code> is running and you opened the URL it printed.');
      console.log('[Dashboard] Fetch failed — using demo data:', e.message);
    }
  }
  renderAll();
}

function showBanner(html) {
  const b = document.getElementById('live-banner');
  if (!b) return;
  b.innerHTML = '⚠ ' + html;
  b.style.display = 'block';
}
function hideBanner() {
  const b = document.getElementById('live-banner');
  if (b) b.style.display = 'none';
}

function setLiveStatus(ok, scanDate) {
  const tag = document.getElementById('live-source');
  if (!tag) return;
  const stamp = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if (ok) {
    tag.textContent = 'Live DB · ' + (scanDate || SCAN_DATE) + ' · updated ' + stamp;
    tag.classList.remove('badge-red');
    tag.classList.add('badge-blue');
  } else if (liveConnected) {
    // Only show a "connection lost" state once we've actually seen live data before —
    // otherwise this is just the normal demo-data fallback and shouldn't look like an error.
    tag.textContent = 'Reconnecting… last update ' + stamp;
    tag.classList.remove('badge-blue');
    tag.classList.add('badge-red');
  } else {
    tag.textContent = 'Demo data';
  }
}

function applyLiveData(live) {
  // Overwrite SESSION
  SESSION.id      = live.session.id;
  SESSION.runDate = live.session.runDate;
  SESSION.total   = live.session.total   || SESSION.total;
  SESSION.scored  = live.session.scored  || SESSION.scored;

  // Overwrite SCAN_DATE if present
  if (live.scanDate) window.SCAN_DATE_LIVE = live.scanDate;

  // v4.0: market regime + data-quality summary (null-safe — older server payloads won't have these)
  if (live.marketRegime) MARKET_REGIME = live.marketRegime;
  if (live.dataQuality)  DATA_QUALITY  = live.dataQuality;
  // v4.1
  if (live.sectorRotation && live.sectorRotation.length) SECTOR_ROTATION = live.sectorRotation;
  if (live.session && live.session.weightSource) WEIGHT_SOURCE = live.session.weightSource;

  // Replace STOCKS with live data
  STOCKS.length = 0;
  (live.stocks || []).forEach(s => {
    // Ensure all fields exist (backfill missing indicator fields)
    s.vcp   = s.vcp   ?? false;
    s.volR  = s.volR  ?? 1.0;
    s.adx   = s.adx   ?? 0;
    s.pdi   = s.pdi   ?? 0;
    s.mdi   = s.mdi   ?? 0;
    s.moSc  = s.moSc  ?? 0;
    s.wSc   = s.wSc   ?? 0;
    s.dSc   = s.dSc   ?? 0;
    s.hSc   = s.hSc   ?? 0;
    s.m15Sc = s.m15Sc ?? 0;
    s.m5Sc  = s.m5Sc  ?? 0;
    s.bullTf= s.bullTf?? [s.moSc,s.wSc,s.dSc,s.hSc,s.m15Sc,s.m5Sc].filter(x=>x>0).length;
    s.bearTf= s.bearTf?? 6 - s.bullTf;
    s.scores= s.scores || {st:0,hma:0,adx:0,vcp:0,vol:0,tr:0};
    s.levels= s.levels || {yH:0,yL:0,qH:0,qL:0,mH:0,mL:0,wH:0,wL:0,p52H:0,p52L:0,pMH:0,pWH:0};
    s.st    = s.st    || {bull:false,days:0,flip:'',hh:0,hhAgo:0,hl:0,hlAgo:0,lh:0,lhAgo:0,ll:0,llAgo:0};
    s.hmaFast= s.hmaFast ?? s.close;
    s.hmaSlow= s.hmaSlow ?? s.close;
    s.emaFast= s.emaFast ?? s.close;
    s.emaSlow= s.emaSlow ?? s.close;
    s.avgVol = s.avgVol  ?? 0;
    s.sector = s.sector  || '—';
    // v4.0: relative strength, liquidity, extension, ATR risk levels — default to
    // non-blocking/neutral when a server payload predates these fields.
    s.rsRank          = s.rsRank ?? 50;
    s.avgTurnover     = s.avgTurnover ?? 0;
    s.isLiquid        = s.isLiquid ?? true;
    s.extensionPct    = s.extensionPct ?? 0;
    s.isExtended      = s.isExtended ?? false;
    s.atr             = s.atr ?? 0;
    s.suggestedStop   = s.suggestedStop ?? 0;
    s.suggestedTarget = s.suggestedTarget ?? 0;
    s.gateReason      = s.gateReason ?? '';
    // v4.1: sector rotation rank + fundamentals + earnings blackout — default to neutral/unknown
    // when a server payload predates these fields, exactly like the v4.0 backfill above.
    s.sectorRank        = s.sectorRank ?? 50;
    s.fundamentals      = s.fundamentals ?? {pe:null,roePct:null,debtToEquity:null,epsGrowthPct:null,promoterPledgePct:null,hasData:false};
    s.nextEarningsDate  = s.nextEarningsDate ?? null;
    s.inEarningsBlackout= s.inEarningsBlackout ?? false;
    STOCKS.push(s);
  });
}

function renderAll() {
  BUYS.length=0;  SELLS.length=0;
  // Use the backend's own recommendation tag (rec) as the single source of truth —
  // it already applies the real BUY/SELL thresholds *and* the TopBuyCount/TopSellCount
  // ranking limits. Re-deriving a different threshold here would silently disagree
  // with what the scanner actually flagged.
  STOCKS.filter(s=>s.rec==='BUY').sort((a,b)=>b.aggScore-a.aggScore)
        .forEach((s,i)=>{ s.rank=i+1; BUYS.push(s); });
  STOCKS.filter(s=>s.rec==='IMMEDIATE_SELL').sort((a,b)=>a.aggScore-b.aggScore)
        .forEach((s,i)=>{ s.rank=i+1; SELLS.push(s); });
  renderHeader();
  renderRegimeBanner();
  renderCards();
  renderTabs();
  renderDashboard();
  renderBuys();
  renderSells();
  renderMatrix();
  renderLevels();
  renderSupertrend();
}

// ═══════════════════════════════════════════════════════════════
//  INIT  — async load then render
// ═══════════════════════════════════════════════════════════════
const BUYS=[], SELLS=[];
loadAndRender();
setInterval(loadAndRender, REFRESH_INTERVAL_MS);
</script>
</body>
