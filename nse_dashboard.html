<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSE Momentum Scanner — Trading Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
:root{
  --bg0:#080d18;--bg1:#0e1525;--bg2:#141e33;--bg3:#1a2540;--bg4:#20304e;
  --border:#1e2d47;--border2:#2a3d5c;
  --text1:#e8edf5;--text2:#8fa3c0;--text3:#56708c;
  --green:#10b981;--green2:#064e3b;--green3:#d1fae5;
  --red:#ef4444;--red2:#450a0a;--red3:#fecaca;
  --amber:#f59e0b;--amber2:#451a03;--amber3:#fef3c7;
  --blue:#3b82f6;--blue2:#1e3a8a;--blue3:#dbeafe;
  --purple:#8b5cf6;--cyan:#06b6d4;
  --r:8px;--r2:12px;
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg0);color:var(--text1);font-family:var(--font);font-size:13px;min-height:100vh}
a{color:var(--blue);text-decoration:none}

/* ── Layout ── */
.hdr{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 20px;height:56px;
     display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.hdr-logo{font-size:15px;font-weight:600;letter-spacing:-.3px;color:var(--text1)}
.hdr-logo span{color:var(--blue)}
.hdr-meta{font-size:12px;color:var(--text3);margin-left:auto;display:flex;gap:20px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge-green{background:var(--green2);color:var(--green)}
.badge-red{background:var(--red2);color:var(--red)}
.badge-amber{background:var(--amber2);color:var(--amber)}
.badge-blue{background:var(--blue2);color:var(--blue)}
.badge-gray{background:var(--bg3);color:var(--text2)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.wrap{padding:20px;max-width:1600px;margin:0 auto}

/* ── Cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.card-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.card-value{font-size:26px;font-weight:600;line-height:1}
.card-sub{font-size:11px;color:var(--text3);margin-top:4px}
.card-green .card-value{color:var(--green)}
.card-red .card-value{color:var(--red)}
.card-amber .card-value{color:var(--amber)}
.card-blue .card-value{color:var(--blue)}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;background:var(--bg1);border:1px solid var(--border);
      border-radius:var(--r);padding:4px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;
     color:var(--text3);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--text1);background:var(--bg3)}
.tab.active{background:var(--bg3);color:var(--text1);border:1px solid var(--border2)}
.tab-count{background:var(--bg4);color:var(--text2);padding:1px 6px;border-radius:10px;font-size:10px}
.panel{display:none}.panel.active{display:block}

/* ── Sub-tab pills (within a panel — e.g. Shockers period, Streaks daily/weekly) ── */
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtab{padding:5px 12px;border-radius:16px;cursor:pointer;font-size:11px;font-weight:600;
        color:var(--text3);background:var(--bg1);border:1px solid var(--border);transition:all .15s}
.subtab:hover{color:var(--text1);border-color:var(--border2)}
.subtab.active{background:var(--blue2);color:var(--blue);border-color:var(--blue)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}

/* ── Tables ── */
.tbl-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.tbl-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
          border-bottom:1px solid var(--border);background:var(--bg2)}
.tbl-title{font-size:13px;font-weight:500}
.tbl-search{background:var(--bg3);border:1px solid var(--border);color:var(--text1);
            padding:6px 10px;border-radius:6px;font-size:12px;width:200px;outline:none}
.tbl-search::placeholder{color:var(--text3)}
table{width:100%;border-collapse:collapse}
th{padding:9px 10px;text-align:left;font-size:11px;font-weight:500;color:var(--text3);
   border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;background:var(--bg2);
   text-transform:uppercase;letter-spacing:.4px}
th:hover{color:var(--text1)}
th .sort-icon{opacity:.4;margin-left:3px;font-size:10px}
th.sorted .sort-icon{opacity:1;color:var(--blue)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2);cursor:pointer}
.tr-buy:hover td{background:rgba(16,185,129,.06)}
.tr-sell:hover td{background:rgba(239,68,68,.06)}
.tr-sel td{background:rgba(59,130,246,.08)}

/* ── TF Signal dots ── */
.tf-dots{display:flex;gap:4px;align-items:center}
.tf-dot{width:14px;height:14px;border-radius:50%;font-size:8px;font-weight:700;
        display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.tf-bull{background:var(--green)}
.tf-bear{background:var(--red)}
.tf-neut{background:var(--bg4);color:var(--text3)}

/* ── Score bar ── */
.score-bar{display:flex;align-items:center;gap:6px}
.score-num{font-weight:600;font-size:13px;width:42px;text-align:right}
.bar-outer{width:70px;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.bar-inner{height:100%;border-radius:3px;transition:width .3s}

/* ── Price bar (52w context) ── */
.price-bar-wrap{display:flex;align-items:center;gap:6px}
.price-bar-outer{width:80px;height:6px;background:var(--bg4);border-radius:3px;position:relative}
.price-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--amber),var(--green))}
.price-bar-cursor{position:absolute;top:-2px;width:2px;height:10px;background:var(--text1);border-radius:1px}
.price-pct{font-size:11px;width:46px;text-align:right}

/* ── Level cells ── */
.level-pair{display:flex;flex-direction:column;gap:1px}
.level-h{color:var(--green);font-size:11px}
.level-l{color:var(--red);font-size:11px}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;
               align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg1);border:1px solid var(--border2);border-radius:var(--r2);
       width:100%;max-width:900px;max-height:90vh;overflow-y:auto}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;
           position:sticky;top:0;background:var(--bg1);z-index:1}
.modal-sym{font-size:18px;font-weight:600}
.modal-body{padding:20px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.modal-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.modal-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.modal-section-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;
                      letter-spacing:.6px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:4px 0;
    border-bottom:1px solid var(--border);font-size:12px}
.kv:last-child{border-bottom:none}
.kv-key{color:var(--text3)}
.kv-val{font-weight:500}
.score-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0}
.score-component{font-size:11px;color:var(--text2);width:80px}
.score-component-bar{flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin:0 10px}
.score-component-fill{height:100%;border-radius:4px}
.score-component-val{font-size:11px;font-weight:600;width:36px;text-align:right}

/* ── Level meter ── */
.level-meter{position:relative;height:28px;border-radius:4px;
             background:linear-gradient(90deg,var(--red2),var(--amber2),var(--green2));
             border:1px solid var(--border);margin:8px 0}
.level-needle{position:absolute;top:2px;width:4px;height:24px;background:var(--text1);
              border-radius:2px;transform:translateX(-50%)}
.level-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:2px}

/* ── Supertrend summary ── */
.st-box{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st-metric{background:var(--bg3);border-radius:var(--r);padding:10px;text-align:center}
.st-metric-label{font-size:10px;color:var(--text3);margin-bottom:4px}
.st-metric-val{font-size:14px;font-weight:600}
.st-metric-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* ── Matrix grid ── */
.matrix-grid{display:grid;gap:1px;background:var(--border)}
.matrix-cell{padding:8px 6px;text-align:center;font-size:11px;font-weight:500;transition:opacity .2s}
.matrix-cell:hover{opacity:.8}
.matrix-header{background:var(--bg2);color:var(--text3);font-size:10px;padding:8px 6px}

/* ── Misc ── */
.section-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text1);
               display:flex;align-items:center;gap:8px}
.sep{height:1px;background:var(--border);margin:16px 0}
.empty{padding:40px;text-align:center;color:var(--text3)}
.close-btn{margin-left:auto;background:none;border:none;color:var(--text3);cursor:pointer;
           padding:4px;border-radius:4px;display:flex;align-items:center}
.close-btn:hover{color:var(--text1);background:var(--bg3)}
.chart-wrap{position:relative;width:100%;height:200px}
.rec-buy{color:var(--green);font-weight:600}
.rec-sell{color:var(--red);font-weight:600}
.rec-hold{color:var(--text3)}
.sym-link{color:var(--text1);font-weight:500;font-size:12px}
.rank-badge{width:22px;height:22px;border-radius:50%;background:var(--bg3);color:var(--text2);
            font-size:10px;display:flex;align-items:center;justify-content:center}

/* ── v4.0: regime banner + quality badges ── */
.regime-banner{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--bg1);
               border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.regime-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.regime-bullish{background:var(--green2);color:var(--green)}
.regime-bearish{background:var(--red2);color:var(--red)}
.regime-neutral{background:var(--amber2);color:var(--amber)}
.regime-stat{font-size:11px;color:var(--text2)}
.regime-stat b{color:var(--text1);font-weight:600}
.mini-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;letter-spacing:.3px}
.mini-badge-warn{background:var(--amber2);color:var(--amber)}
.mini-badge-bad{background:var(--red2);color:var(--red)}
.gate-reason{font-size:10px;color:var(--text3);font-style:italic}
@media(max-width:700px){.modal-grid{grid-template-columns:1fr}.modal-grid3{grid-template-columns:1fr 1fr}.hdr-meta{display:none}}

/* ── Market context collapse ── */
.market-context{margin-bottom:16px}.market-context .regime-banner{margin-bottom:10px}
.market-context.collapsed .regime-banner{margin-bottom:0}
.market-context.collapsed .regime-stat,.market-context.collapsed .regime-pill + .regime-stat,.market-context.collapsed .regime-banner .regime-extra{display:none}
.market-context.collapsed #summary-cards{display:none}
.market-context-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);border-radius:6px;padding:5px 9px;font-size:10px;font-weight:600;cursor:pointer}
.market-context-toggle:hover{border-color:var(--blue);color:var(--text1)}

/* ── v4.4: Charts tab (TradingView-style candlestick + indicators) ── */
.chart-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg1);
               border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:14px}
.chart-search-wrap{position:relative;width:260px}
.chart-search{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text1);
              padding:7px 10px 7px 30px;border-radius:6px;font-size:12px;outline:none}
.chart-search:focus{border-color:var(--blue)}
.chart-search-wrap i{position:absolute;left:9px;top:8px;font-size:14px;color:var(--text3)}
.chart-search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:280px;overflow-y:auto;
              background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);
              box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:50;display:none}
.chart-search-results.open{display:block}
.chart-search-item{padding:8px 12px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.chart-search-item:hover{background:var(--bg3)}
.chart-search-item .csi-sec{color:var(--text3);font-size:10px}
.chart-symbol-badge{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg3);
              border:1px solid var(--border2);border-radius:6px;font-size:13px;font-weight:600}
.chart-symbol-badge .csb-price{font-weight:500;color:var(--text2);font-size:12px}
.chart-toolbar-sep{width:1px;height:24px;background:var(--border2)}
.chart-toggle{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:14px;cursor:pointer;
              font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--text3);
              background:var(--bg2);user-select:none;transition:all .15s}
.chart-toggle .ctg-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35}
.chart-toggle.on{color:var(--text1);border-color:var(--border2)}
.chart-toggle.on .ctg-dot{opacity:1}
.chart-empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
              justify-content:center;background:var(--bg1);border-radius:var(--r);
              text-align:center;color:var(--text3);font-size:13px;z-index:3}
.chart-empty-hint i{font-size:32px;display:block;margin-bottom:10px;opacity:.5}
.chart-pane-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);
              padding:10px 4px 4px;margin-bottom:2px;position:relative}
.chart-pane-label{position:absolute;top:8px;left:14px;z-index:5;font-size:10px;font-weight:600;
              color:var(--text3);text-transform:uppercase;letter-spacing:.5px;pointer-events:none}
.chart-pane-legend{position:absolute;top:8px;right:14px;z-index:5;font-size:10px;display:flex;gap:10px;
              pointer-events:none}
.chart-legend-item{display:flex;align-items:center;gap:4px}
.chart-legend-swatch{width:9px;height:2px;border-radius:1px}
#chart-main-pane{height:clamp(460px,calc(100vh - 350px),680px);min-height:0}
#chart-adx-pane{height:150px;min-height:0}
/* Keep the trading chart visually proportional instead of letting viewport height dictate it. */
.chart-pane-wrap{box-sizing:border-box;overflow:hidden}
#chartMainWrap{min-height:0}
#chartAdxWrap{min-height:0}
.chart-popup-scroll{min-height:0}
@media (max-width:900px){
  #chart-main-pane{height:clamp(400px,58vw,620px)}
  #chart-adx-pane{height:140px}
}
.chart-info-strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 10px;margin:2px 0;font-size:10px;color:var(--text3);background:var(--bg1);border:1px solid var(--border);border-radius:var(--r)}
.chart-info-strip b{color:var(--text1)}
.chart-level-line{position:absolute;left:0;right:0;height:1px;border-top:1px dashed;opacity:.62;z-index:2;pointer-events:none}
.chart-level-line.day{border-color:#22d3ee}.chart-level-line.prev{border-color:#60a5fa;opacity:.48}
.chart-sr-line{position:absolute;left:0;right:0;height:1px;border-top:1px dotted;z-index:2;pointer-events:none;opacity:.48}.chart-sr-line.support{border-color:#22c55e}.chart-sr-line.resistance{border-color:#ef4444}
.chart-level-line.week{border-color:#f59e0b;opacity:.55}.chart-level-line.year{border-color:#a78bfa;opacity:.45}
.chart-volume-profile{position:absolute;top:10px;right:4px;bottom:4px;width:18%;z-index:3;pointer-events:none;opacity:.24}
.chart-volume-profile div{position:absolute;right:0;height:4px;min-width:2px;background:#94a3b8;border-radius:2px}

.chart-status{font-size:11px;color:var(--text3);margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chart-status.err{color:var(--red)}
.chart-status.warn{color:var(--amber)}
.chart-status a{color:var(--blue);cursor:pointer;text-decoration:underline}
.chart-badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.4px}
.chart-badge.live{background:rgba(16,185,129,.16);color:var(--green)}
.chart-badge.closed{background:rgba(143,163,192,.14);color:var(--text2)}
.chart-badge.stale{background:rgba(245,158,11,.18);color:var(--amber)}
.chart-fvg.filled{opacity:.35}
.chart-plan{margin:2px 0;padding:10px 12px;font-size:11px;color:var(--text2);background:var(--bg1);border:1px solid var(--border);border-radius:var(--r)}
.chart-plan:empty{display:none}
.chart-plan .cp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;color:var(--text1)}
.chart-plan .cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px}
.chart-plan .cp-grid span{display:block;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.chart-plan .cp-grid b{color:var(--text1);font-size:12px;font-weight:600}
.chart-plan .cp-note{margin-top:8px;color:var(--text3);line-height:1.5}
.chart-plan .cp-warn{color:var(--amber)}
.chart-badge.armed{background:rgba(251,191,36,.18);color:#fbbf24}.chart-badge.trig{background:rgba(16,185,129,.18);color:var(--green)}
.chart-badge.blocked{background:rgba(239,68,68,.16);color:var(--red)}.chart-badge.watch{background:rgba(143,163,192,.14);color:var(--text2)}
/* v4.5 chart popout: the dashboard itself becomes a clean, closable chart window. */
body.chart-popup-mode{overflow:hidden}
body.chart-popup-mode .hdr,
body.chart-popup-mode #live-banner,
body.chart-popup-mode #regime-banner,
body.chart-popup-mode #summary-cards,
body.chart-popup-mode #tabs{display:none!important}
body.chart-popup-mode .wrap{max-width:none;width:100%;height:100vh;padding:8px;box-sizing:border-box}
body.chart-popup-mode .panel{display:none!important}
body.chart-popup-mode #panel-charts{display:flex!important;flex-direction:column;height:100%;min-height:0;margin:0;overflow-x:hidden;overflow-y:auto;scrollbar-gutter:stable}
/* The popup has a scrollable chart viewport. This prevents cramped charts on short screens. */
body.chart-popup-mode #chartMainWrap,
body.chart-popup-mode #chartAdxWrap{flex:0 0 auto}
body.chart-popup-mode #chartMainWrap{height:auto;min-height:420px}
body.chart-popup-mode #chartAdxWrap{height:auto;min-height:130px}
body.chart-popup-mode #chart-main-pane{height:100%;min-height:0}
body.chart-popup-mode #chartAdxWrap #chart-adx-pane{height:100%;min-height:0}
body.chart-popup-mode .chart-toolbar{position:sticky;top:0;z-index:20;flex:0 0 auto;margin-bottom:6px;padding:7px 9px}
body.chart-popup-mode .chart-info-strip{flex:0 0 auto;margin:2px 0 4px}
body.chart-popup-mode .chart-status{flex:0 0 auto;margin:3px 0;font-size:10px}
body.chart-popup-mode .chart-pane-wrap{margin-bottom:4px}
body.chart-popup-mode .chart-popout-btn.maximize{display:inline-flex}
/* When the available height is smaller than the preferred layout, scroll rather than distort it. */
body.chart-popup-mode.chart-layout-scroll #panel-charts{padding-right:2px}
body.chart-popup-mode.chart-layout-scroll #chartMainWrap,
body.chart-popup-mode.chart-layout-scroll #chartAdxWrap{flex:none}
body.chart-popup-mode.chart-layout-scroll #chart-main-pane{height:calc(min(62vw, 660px));min-height:420px}
body.chart-popup-mode.chart-layout-scroll #chart-adx-pane{height:155px;min-height:155px}
@media (max-width:1100px){
  body.chart-popup-mode.chart-layout-scroll #chart-main-pane{height:calc(min(68vw, 600px))}
}
@media (max-width:700px){
  body.chart-popup-mode.chart-layout-scroll #chart-main-pane{height:460px}

// Shared HTML/attribute escaping helper used by all dashboard renderers.
// Keeps dynamic DB/live values safe when interpolated into innerHTML and onclick attributes.
function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Shared numeric formatting helpers. These are intentionally null-safe because
// older dashboard_data.json payloads can omit optional calculated fields.
function fNum(value, decimals = 2) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  return n.toLocaleString('en-IN', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function fPct(value, decimals = 1) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  return `${n >= 0 ? '+' : ''}${n.toFixed(decimals)}%`;
}

function fInt(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  return Math.round(n).toLocaleString('en-IN');
}

const SCAN_DATE = "2026-06-03";

const rnd=(lo,hi,dp=1)=>parseFloat((lo+Math.random()*(hi-lo)).toFixed(dp));
Math.seedrandom = function(s){let x=s;return()=>{x=Math.sin(x)*10000;return x-Math.floor(x)}};
let rng=0;
const sr=()=>{rng=Math.sin(rng*9301+49297)%1;return Math.abs(rng)};
const srnd=(lo,hi,dp=1)=>parseFloat((lo+sr()*(hi-lo)).toFixed(dp));

function mkStock(sym, close, aggScore, stDays, vcpFlag, sector) {
  sr(); // advance seed
  const bull = aggScore > 0;
  const sp   = close * 0.20;
  const yL   = +(close - sp * srnd(.6,1.0)).toFixed(2);
  const yH   = +(close + sp * srnd(.15,.6)).toFixed(2);
  const mL   = +(close - sp * srnd(.12,.32)).toFixed(2);
  const mH   = +(close + sp * srnd(.01,.14)).toFixed(2);
  const qL   = +(close - sp * srnd(.30,.52)).toFixed(2);
  const qH   = +(close + sp * srnd(.08,.28)).toFixed(2);
  const wL   = +(close - sp * srnd(.03,.09)).toFixed(2);
  const wH   = +(close + sp * srnd(.01,.05)).toFixed(2);

  const noise  = ()=>+srnd(-14,14,0);
  const moSc   = Math.round(Math.min(100,Math.max(-80,aggScore*.70+noise())));
  const wSc    = Math.round(Math.min(100,Math.max(-80,aggScore*.85+noise())));
  const dSc    = Math.round(Math.min(100,Math.max(-80,aggScore*1.05+noise())));
  const hSc    = Math.round(Math.min(100,Math.max(-80,aggScore*.90+noise())));
  const m15Sc  = Math.round(Math.min(100,Math.max(-80,aggScore*.92+noise())));
  const m5Sc   = Math.round(Math.min(100,Math.max(-80,aggScore*.78+noise())));
  const bullTf = [moSc,wSc,dSc,hSc,m15Sc,m5Sc].filter(s=>s>0).length;

  const adx = bull ? srnd(22,48,1) : srnd(18,42,1);
  const pdi = bull ? srnd(24,44,1) : srnd(11,24,1);
  const mdi = bull ? srnd(10,23,1) : srnd(25,47,1);

  const flipDate = new Date(SCAN_DATE);
  flipDate.setDate(flipDate.getDate() - stDays);
  const flip = flipDate.toISOString().split('T')[0];

  const stHH = +(bull ? mH + srnd(0,close*.03) : mH + srnd(0,close*.015)).toFixed(2);
  const stLL = +(bull ? mL - srnd(0,close*.015) : mL - srnd(0,close*.04)).toFixed(2);
  const stHL = +(mL + srnd(.01,.04)*close).toFixed(2);
  const stLH = +(mH - srnd(.01,.04)*close).toFixed(2);

  const sSt  = bull ? 30 : -30;
  const sHma = aggScore>20 ? 15 : aggScore<-20 ? -15 : +srnd(-8,8,0);
  const sAdx = adx>21 ? (pdi>mdi?15:-15) : 0;
  const sVcp = vcpFlag ? 15 : 0;
  const sVol = bull ? (srnd(0,1)>.4 ? 15 : srnd(-2,8,0)) : (srnd(0,1)>.4 ? -7 : srnd(-5,3,0));
  const sTr  = bull ? 10 : -10;
  const volR = bull ? +srnd(1.1,3.5,2) : +srnd(0.4,1.3,2);
  const vol  = +(close * srnd(50000,2000000,0));
  const avgVol = +(vol / volR);

  // ── v4.0 demo fields: RS rank, liquidity, extension, ATR stop/target ──
  const rsRank = bull ? Math.round(srnd(55,99)) : Math.round(srnd(1,60));
  const avgTurnover = avgVol * close;
  const isLiquid = avgTurnover >= 50000000;
  const extensionPct = bull ? +srnd(-4,30,1) : +srnd(-20,8,1);
  const isExtended = extensionPct > 25;
  const atr = +(close * srnd(0.015,0.045)).toFixed(2);
  const suggestedStop = +(close - atr*2.5).toFixed(2);
  const suggestedTarget = +(close + atr*2.5*2.5).toFixed(2);
  const gateReasons=[];
  if(bull && rsRank<70) gateReasons.push('weak RS vs Nifty');
  if(bull && !isLiquid) gateReasons.push('low liquidity');
  if(bull && isExtended) gateReasons.push('extended from 50-EMA');
  const gateReason = (aggScore>=20 && aggScore<40 && gateReasons.length) ? gateReasons.join(', ') : '';

  // ── v4.1 demo fields: sector rank, fundamentals, earnings blackout ──
  const sectorRank = Math.round(srnd(1,99));
  const hasFundamentals = srnd(0,1) > 0.35; // most demo names have data; some don't, to show the "unknown" path
  const fundamentals = hasFundamentals ? {
    pe: +srnd(8,65,1), roePct: +srnd(-5,35,1), debtToEquity: +srnd(0,2.5,2),
    epsGrowthPct: +srnd(-15,45,1), promoterPledgePct: +srnd(0,1)>0.8 ? +srnd(10,70,1) : 0,
    hasData: true,
  } : {pe:null,roePct:null,debtToEquity:null,epsGrowthPct:null,promoterPledgePct:null,hasData:false};
  const hasUpcomingEarnings = srnd(0,1) > 0.85;
  const earningsDaysOut = Math.floor(srnd(-2, 45));
  const nextEarningsDate = hasUpcomingEarnings
    ? new Date(Date.now() + earningsDaysOut*86400000).toISOString().slice(0,10) : null;
  const inEarningsBlackout = hasUpcomingEarnings && earningsDaysOut >= 0 && earningsDaysOut <= 3;

  return {
    sym, close, aggScore, moSc, wSc, dSc, hSc, m15Sc, m5Sc, bullTf, bearTf:6-bullTf, sector,
    levels:{wH,wL,mH,mL,qH,qL,yH,yL,
            p52H:+((close-yH)/yH*100).toFixed(2),
            p52L:+((close-yL)/yL*100).toFixed(2),
            pMH:+((close-mH)/mH*100).toFixed(2),
            pWH:+((close-wH)/wH*100).toFixed(2)},
    st:{bull,days:stDays,flip,
        hh:stHH,hhAgo:Math.floor(srnd(1,Math.max(2,stDays*.4))),
        hl:stHL,hlAgo:Math.floor(srnd(1,Math.max(2,stDays*.5))),
        lh:stLH,lhAgo:Math.floor(srnd(1,Math.max(2,stDays*.6))),
        ll:stLL,llAgo:Math.floor(srnd(1,Math.max(2,stDays*.8)))},
    adx,pdi,mdi,volR,vcp:vcpFlag,vol,avgVol,
    scores:{st:sSt,hma:sHma,adx:sAdx,vcp:sVcp,vol:sVol,tr:sTr},
    hmaFast:+(close*(1+srnd(-.005,.01))).toFixed(2),
    hmaSlow:+(close*(1-srnd(.002,.012))).toFixed(2),
    emaFast:+(close*(1+srnd(-.003,.008))).toFixed(2),
    emaSlow:+(close*(1-srnd(.003,.015))).toFixed(2),
    rsRank, avgTurnover, isLiquid, extensionPct, isExtended, atr, suggestedStop, suggestedTarget, gateReason,
    sectorRank, fundamentals, nextEarningsDate, inEarningsBlackout,
    rec: aggScore>=40?"BUY": aggScore<=-30?"IMMEDIATE_SELL":"HOLD"
  };
}

// v4.2: demo price/volume shockers (1D/3D/1W/1M) + consecutive gainers/losers (overwritten by
// applyLiveData when live). Built from the same seeded STOCKS array + deterministic srnd/sr
// generator as everything else here, so demo mode looks plausible and clicking a row opens
// a real modal (the symbol already exists in STOCKS).
function mkDemoShockers(){
  const periodDefs=[['1D',1],['3D',1.8],['1W',3.2],['1M',6.5]]; // rough vol scaling per horizon
  const periods={};
  periodDefs.forEach(([label,scale])=>{
    const rows=STOCKS.map(s=>({
      sym: s.sym, close: s.close,
      pctChange: srnd(-scale*9, scale*9, 2),
      volR: srnd(0.4, 4.2, 2),
      avgTurnover: s.avgTurnover || (s.avgVol||0)*s.close,
    }));
    periods[label] = {
      gainers: [...rows].filter(r=>r.pctChange>=0).sort((a,b)=>b.pctChange-a.pctChange).slice(0,15),
      losers:  [...rows].filter(r=>r.pctChange<0).sort((a,b)=>a.pctChange-b.pctChange).slice(0,15),
      volume:  [...rows].sort((a,b)=>b.volR-a.volR).slice(0,15),
    };
  });
  const mkStreak=(dir,minLen)=>{
    const picks=[...STOCKS].sort(()=>sr()-0.5).slice(0,6);
    return picks.map(s=>({
      sym: s.sym, len: minLen + Math.floor(sr()*4), dir,
      start: SCAN_DATE, end: SCAN_DATE,
      cumPct: (dir==='UP'?1:-1)*srnd(2,18,1),
      close: s.close,
    })).sort((a,b)=>b.len-a.len);
  };
  return {
    periods,
    consecutive: {
      daily:  { gainers: mkStreak('UP',3),  losers: mkStreak('DOWN',3),  minStreak: 3 },
      weekly: { gainers: mkStreak('UP',2),  losers: mkStreak('DOWN',2),  minStreak: 2 },
    },
  };
}

function scoreBarHtml(score,maxAbs=100){
  const pct = Math.min(100,Math.abs(score)/maxAbs*100);
  const c = scoreColor(score);
  return `<div class="score-bar">
    <span class="score-num" style="color:${c}">${score>0?'+':''}${score}</span>
    <div class="bar-outer"><div class="bar-inner" style="width:${pct}%;background:${c}"></div></div>

}

  return `<div class="tf-dots">${labels.map((l,i)=>{

    return`<div class="tf-dot ${cls}" title="${l}: ${sc>0?'+':''}${sc}">${l[0]}</div>`;

}

  </div>`;
}

function toggleMarketContext(){
  const el=document.getElementById('market-context'); if(!el)return;
  const collapsed=el.classList.toggle('collapsed');

  if(b){b.setAttribute('aria-expanded',String(!collapsed));b.innerHTML=collapsed?'<i class="ti ti-chevron-down"></i><span>Expand market context</span>':'<i class="ti ti-chevron-up"></i><span>Collapse market context</span>';}
  try{localStorage.setItem('nseMarketContextCollapsed',collapsed?'1':'0');}catch{}

function restoreMarketContextState(){

}

// ─── Trade-plan columns (daily plan computed at scan time; Charts tab recomputes it live) ───
const PLAN_STATE_RANK={TRIGGERED:5,ARMED:4,WATCH:3,EXTENDED:2,BLOCKED:1,NO_PLAN:0};
const PLAN_BADGE={ARMED:'armed',TRIGGERED:'trig',EXTENDED:'blocked',BLOCKED:'blocked',WATCH:'watch',NO_PLAN:'watch'};
const planOf=(s,side)=>side==='SHORT'?s.planShort:s.planLong;
const planUsable=pl=>!!(pl&&pl.state&&pl.state!=='NO_PLAN'&&pl.trigger);
const planGated=pl=>pl&&(pl.state==='BLOCKED'||pl.state==='EXTENDED');
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
function planSizeOf(s,pl){return planUsable(pl)&&!planGated(pl)?tradePlanSizing(pl,[{v:s.avgVol||0}]):null;}
function planColDefs(side){
  const num=f=>s=>{const p=planOf(s,side);return planUsable(p)?f(p,s):-1e12;};
  const sz=f=>s=>{const z=planSizeOf(s,planOf(s,side));return z?f(z):-1e12;};
  return [
    {label:'Plan',val:s=>PLAN_STATE_RANK[(planOf(s,side)||{state:'NO_PLAN'}).state]??0},
    {label:'Entry',val:num(p=>p.trigger)},{label:'Stop',val:num(p=>p.stop)},{label:'Risk',val:num(p=>p.riskPct)},
    {label:'T1',val:num(p=>p.targets[0].price)},{label:'T2',val:num(p=>p.targets[1].price)},{label:'T3',val:num(p=>p.targets[2].price)},
    {label:'Vol need / last',val:num(p=>p.rvolNow)},
    {label:'Qty',val:sz(z=>z.qty)},{label:'Capital',val:sz(z=>z.deployed)},{label:'Max loss',val:sz(z=>z.risk)},{label:'% ADV',val:sz(z=>z.advPct??0)},
  ];
}
function planHeaderTitle(label){return {Plan:'Daily breakout/breakdown plan state as of the scan (hover a badge for the reason)',Entry:'Trigger: enter only on a CLOSE through this level',Risk:'Risk per share · % of entry','Vol need / last':'Volume multiple required vs last completed bar','% ADV':'Quantity as % of 20-bar average volume'}[label]||'';}
// side: 'LONG' | 'SHORT'. showSide prefixes the badge with ▲/▼ (Score Matrix mixes both sides).
function planCellsHtml(s,side,pad='',showSide=false){
  const pl=planOf(s,side),st=`font-size:11px;white-space:nowrap;${pad}`,dash=`<td style="${st};color:var(--text3)">—</td>`;
  if(!pl)return `<td style="${st};color:var(--text3)" title="No plan — run a new scan to compute plans">—</td>`+dash.repeat(11);
  const arrow=showSide?(side==='SHORT'?'▼ ':'▲ '):'';
  const badge=`<td style="${st}"><span class="chart-badge ${PLAN_BADGE[pl.state]||'watch'}" title="${esc(pl.reason||'')}">${arrow}${esc(pl.state.replace('_',' '))}</span></td>`;
  if(!planUsable(pl))return badge+dash.repeat(11);
  const f=n=>fNum(n,2),z=planSizeOf(s,pl),t=pl.targets||[];
  const volOk=pl.rvolNow>=pl.rvolNeeded;
  const sizing=z?`<td style="${st};text-align:right">${z.qty.toLocaleString('en-IN')}</td><td style="${st};text-align:right">${inr(z.deployed)}</td>
    <td style="${st};text-align:right;color:var(--red)">${inr(z.risk)}</td><td style="${st};text-align:right;color:${z.advPct!=null&&z.advPct>1?'var(--amber)':'inherit'}">${z.advPct==null?'—':z.advPct.toFixed(2)+'%'}</td>`
    :`<td colspan="4" style="${st};color:var(--text3)" title="Sizing hidden — plan is gated (${esc(pl.state)})">gated</td>`;
  return badge+
    `<td style="${st};text-align:right;font-weight:600" title="Enter on a close ${side==='SHORT'?'below':'above'} this level">${f(pl.trigger)}</td>`+
    `<td style="${st};text-align:right;color:var(--red)">${f(pl.stop)}</td>`+
    `<td style="${st}">₹${f(pl.riskPerShare)} · ${pl.riskPct}%</td>`+
    t.map(x=>`<td style="${st};text-align:right;color:var(--green)" title="${x.r}R">${f(x.price)}</td>`).join('')+
    `<td style="${st};color:${volOk?'var(--green)':'var(--text2)'}">${Number(pl.rvolNeeded).toFixed(1)}× / ${Number(pl.rvolNow).toFixed(2)}×</td>`+sizing;
}

// ─── Generic sortable table ──────────────────────────────────────
function sortableTable(panelId, stocks, type, columns, rowFn){
  let sortCol=0, sortAsc=false;
  const panel=document.getElementById(panelId);
  function render(list, query=''){
    const filtered=query ? list.filter(s=>s.sym.toLowerCase().includes(query.toLowerCase())||s.sector.toLowerCase().includes(query.toLowerCase())) : list;
    const sorted=[...filtered].sort((a,b)=>{
      const va=columns[sortCol].val(a), vb=columns[sortCol].val(b);
      return typeof va==='string'?(va<vb?-1:va>vb?1:0)*( sortAsc?1:-1)
                                 :(va-vb)*(sortAsc?1:-1);
    });
    panel.innerHTML=`
      <div class="tbl-wrap">
        <div class="tbl-head">
          <span class="tbl-title">${type==='buy'?
            `<span style="color:var(--green)"><i class="ti ti-trending-up"></i> Top ${BUYS.length} Buy Candidates</span>`:
            `<span style="color:var(--red)"><i class="ti ti-trending-down"></i> Top ${SELLS.length} Immediate Sells</span>`}</span>
          <input class="tbl-search" placeholder="Search symbol / sector…" id="search-${panelId}" value="${query}">
        </div>
        <div style="overflow-x:auto"><table>
          <thead><tr>${columns.map((c,i)=>`
            <th class="${i===sortCol?'sorted':''}" data-col="${i}" title="${esc(planHeaderTitle(c.label))}">${c.label}
              <span class="sort-icon">${i===sortCol?(sortAsc?'↑':'↓'):'↕'}</span></th>`).join('')}
          </tr></thead>
          <tbody>${sorted.map(s=>`<tr class="tr-${type}" onclick="openModal('${esc(s.sym)}')">${rowFn(s)}</tr>`).join('')}</tbody>
        </table></div>
        <div style="padding:8px 16px;font-size:11px;color:var(--text3)">
          ${sorted.length} of ${list.length} stocks  · Click any row for full detail${(type==='buy'||type==='sell')?` · <b>Plan columns</b>: ${type==='sell'?'short breakdown':'long breakout'} plan on the scan's daily bars${window.PLANS_AS_OF?' (as of '+esc(window.PLANS_AS_OF)+')':''} — quantity uses Charts → Settings (capital ${inr(chartSettings.planCapital)}, risk ${chartSettings.planRiskPct}%, cap ${chartSettings.planMaxAllocPct}%). Open the Charts tab for the live plan.${list.some(x=>x.planLong||x.planShort)?'':' <span style="color:var(--amber)">No plans in this data — run a new scan.</span>'}`:''}
        </div>
      </div>`;
    panel.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
      const c=+th.dataset.col;
      if(sortCol===c) sortAsc=!sortAsc; else{sortCol=c;sortAsc=false;}
      render(list, document.getElementById('search-'+panelId)?.value||'');
    }));
    document.getElementById('search-'+panelId)?.addEventListener('input',e=>render(list,e.target.value));
  }
  render(stocks);
}

function renderBuys(){
  const cols=[

    {label:'Symbol',val:s=>s.sym},
    {label:'Sector',val:s=>s.sector},

  const pct52=(s.close-L.yL)/(L.yH-L.yL)*100;
  const pctMo=(s.close-L.mL)/(L.mH-L.mL)*100;
  const pctWk=(s.close-L.wL)/(L.wH-L.wL)*100;
  const maxScores={st:30,hma:15,adx:15,vcp:15,vol:15,tr:10};

  panel.innerHTML=`

  db:null,

};

function series(arr,bars,round=4){return (arr||[]).map((v,i)=>v==null?null:{time:bars[i].t,value:+Number(v).toFixed(round)}).filter(Boolean);}
function indicatorSeries(arr){return (arr||[]).filter(x=>x&&Number.isFinite(Number(x.t))&&Number.isFinite(Number(x.v))).map(x=>({time:Number(x.t),value:Number(x.v)}));}
function mapByTime(arr){const m=new Map();for(const x of arr||[]){if(x&&Number.isFinite(Number(x.t))&&Number.isFinite(Number(x.v)))m.set(Number(x.t),x);}return m;}
function computeChartModel(tfData){
  const bars=(tfData.bars||[]).slice().sort((a,b)=>a.t-b.t);
  const raw=tfData.indicators||{}, a=tfData.analytics||{};
  const ind={
    emaFast:indicatorSeries(raw.emaFast), emaSlow:indicatorSeries(raw.emaSlow),
    hmaFast:indicatorSeries(raw.hmaFast), hmaSlow:indicatorSeries(raw.hmaSlow),
    supertrend:(raw.supertrend||[]).filter(x=>x&&Number.isFinite(Number(x.t))&&Number.isFinite(Number(x.v))), adx:indicatorSeries(raw.adx),
    pdi:indicatorSeries(raw.pdi), mdi:indicatorSeries(raw.mdi),
    atr:indicatorSeries(raw.atr), rsi:indicatorSeries(raw.rsi),
    volumeSma:indicatorSeries(raw.volumeSma),
    rvol:indicatorSeries(raw.rvol), atrDistance:indicatorSeries(raw.atrDistance),
    volumePriceSignal:indicatorSeries(raw.volumePriceSignal)
  };
  // Timestamp-keyed lookups: the filtered arrays above have the warm-up nulls removed, so their
  // positions no longer match bar positions. Hover values MUST be resolved by bar time.
  const at={};
  for(const k of ['emaFast','emaSlow','hmaFast','hmaSlow','supertrend','adx','pdi','mdi','atr','rsi','rvol','atrDistance','volumePriceSignal'])at[k]=mapByTime(raw[k]);
  return {bars,ind,at,levels:a.levels||{},structures:a.structures||{},fvgs:a.fvg||[],plan:((a.tradePlan&&a.tradePlan.state==='NO_PLAN'&&(a.structures||{}).trend==='DOWN'&&a.tradePlanShort)?a.tradePlanShort:(a.tradePlan||null)),
          volumeProfile:a.volumeProfile||[],vpStats:a.volumeProfileStats||{},volumePrice:a.volumePrice||{},vcp:a.vcp||{},
          meta:tfData.meta||{},integrity:tfData.integrity||{}};
}
function themeColor(v,f){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||f;}
function chartIsIntraday(){return currentChartTf==='5m'||currentChartTf==='15m'||currentChartTf==='1h';}
function commonChartOpts(){const border=themeColor('--border','#1e2d47'),text3=themeColor('--text3','#71839a');
  const IST={timeZone:'Asia/Kolkata'};
  return {layout:{background:{color:'transparent'},textColor:text3,fontSize:11},grid:{vertLines:{color:'rgba(127,145,170,.10)'},horzLines:{color:'rgba(127,145,170,.10)'}},rightPriceScale:{borderColor:border,minimumWidth:76},
    timeScale:{borderColor:border,timeVisible:true,secondsVisible:false,
      // tickMarkType: 0 year · 1 month · 2 day-of-month · 3 time · 4 time+seconds
      tickMarkFormatter:(t,type)=>{const d=new Date(t*1000);
        if(type>=3)return d.toLocaleTimeString('en-IN',{...IST,hour:'2-digit',minute:'2-digit',hour12:false});
        if(type===2)return d.toLocaleDateString('en-IN',{...IST,day:'2-digit',month:'short'});
        if(type===1)return d.toLocaleDateString('en-IN',{...IST,month:'short'});
        return d.toLocaleDateString('en-IN',{...IST,year:'numeric'});}},
    localization:{timeFormatter:t=>formatTime(t)},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},handleScroll:true,handleScale:true};}
function initChartInstances(){
  const mainEl=document.getElementById('chart-main-pane'),oscEl=document.getElementById('chart-adx-pane');
  const mainChart=LightweightCharts.createChart(mainEl,{...commonChartOpts(),width:mainEl.clientWidth,height:mainEl.clientHeight});
  mainChart.priceScale('right').applyOptions({scaleMargins:{top:.05,bottom:.18}});

  const mkLine=(color,w=1)=>mainChart.addLineSeries({color,lineWidth:w,priceLineVisible:false,lastValueVisible:false});

function layoutChartViewport(){
  if(!chartPopupSymbol){return;}
  const panel=document.getElementById('panel-charts');
  const mainWrap=document.getElementById('chartMainWrap'),adxWrap=document.getElementById('chartAdxWrap');
  const mainEl=document.getElementById('chart-main-pane'),adxEl=document.getElementById('chart-adx-pane');
  if(!panel||!mainWrap||!adxWrap||!mainEl||!adxEl)return;
  const vh=Math.max(480,window.innerHeight||800), vw=Math.max(760,window.innerWidth||1200);
  // Preferred price-pane aspect: wide trading canvas, with a compact oscillator beneath it.
  // The 62vw cap keeps the chart from becoming excessively tall on ultrawide displays.
  const preferredMain=Math.max(420,Math.min(660,vw*0.62));
  const osc=Math.max(130,Math.min(170,preferredMain*0.25));
  const fixed=panel.clientHeight>0 ? panel.clientHeight : vh-16;
  const chrome=(panel.querySelector('.chart-toolbar')?.offsetHeight||0)
    +(document.getElementById('chartStatusLine')?.offsetHeight||0)
    +(document.getElementById('chartInfoStrip')?.offsetHeight||0)
    +(document.getElementById('chartPlanCard')?.offsetHeight||0)+18;
  const available=Math.max(0,fixed-chrome);
  const preferredTotal=preferredMain+osc+10;
  const needsScroll=available<preferredTotal;
  panel.classList.toggle('chart-layout-scroll',needsScroll);
  document.body.classList.toggle('chart-layout-scroll',needsScroll);   // the CSS rules are keyed on <body>
  if(needsScroll){
    mainWrap.style.height=preferredMain+'px';
    adxWrap.style.height=osc+'px';
  }else{
    // Fit both panes while preserving the preferred ~4:1 price/oscillator relationship.
    const usable=Math.max(550,available-10);
    const mainH=Math.max(420,Math.min(preferredMain,usable*0.80));
    const oscH=Math.max(130,Math.min(170,usable-mainH));
    mainWrap.style.height=mainH+'px';
    adxWrap.style.height=oscH+'px';
  }
}
function resizeChartInstances(){

    const el=document.getElementById('chart-'+k+'-pane');
    if(el&&c&&el.clientWidth&&el.clientHeight)c.applyOptions({width:el.clientWidth,height:el.clientHeight});

}

function levelDefsFor(tf,L){

function applySeriesData(tfData){

function chartsFitInitial100(){
  if(!chartInstances)return;
  const b=chartInstances.model?.bars||[];
  if(!b.length)return;
  const count=Math.min(100,b.length);
  const charts=[chartInstances.mainChart,chartInstances.adxChart];
  const mainEl=document.getElementById('chart-main-pane');
  const width=Math.max(320,mainEl?.clientWidth||1200);
  const candleSpacing=Math.max(3,(width-10)/Math.max(1,count));
  const rightLogicalPadding=10/candleSpacing;
  const range={from:Math.max(0,b.length-count),to:Math.max(0,b.length-1)+rightLogicalPadding};
  for(const c of charts){
    c.timeScale().applyOptions({barSpacing:candleSpacing,rightOffset:rightLogicalPadding});
    c.timeScale().setVisibleLogicalRange(range);
  }
}

function tradePlanSizing(pl,bars){
  // Share count is the user's decision (capital / risk %), so it is computed here, not on the server.
  const cap=Number(chartSettings.planCapital)||0,rp=Number(chartSettings.planRiskPct)||0,al=Number(chartSettings.planMaxAllocPct)||100;
  const rps=Number(pl.riskPerShare)||0; if(!cap||!rp||!rps||!pl.trigger)return null;
  const riskQty=Math.floor(cap*rp/100/rps),allocQty=Math.floor(cap*al/100/pl.trigger),qty=Math.max(0,Math.min(riskQty,allocQty));
  const tail=bars.slice(-20),adv=tail.length?tail.reduce((x,b)=>x+b.v,0)/tail.length:0;
  return {qty,limited:qty===allocQty&&allocQty<riskQty?'allocation cap':'risk budget',deployed:qty*pl.trigger,risk:qty*rps,advPct:adv?qty/adv*100:null};
}

async function loadChartTimeframe(sym,tf,opts={}){
  const key=sym+'|'+tf,hit=chartStore.get(key);
  if(hit&&!opts.force&&Date.now()-hit.fetchedAt<chartTtlMs(tf,hit.d.timeframes?.[tf]?.meta))return {ok:true,cached:true};
  if(chartAbort)chartAbort.abort();                     // only the newest request may update the chart
  const ctl=chartAbort=new AbortController();
  try{
    const r=await fetch('/charts/'+encodeURIComponent(sym)+'?tf='+encodeURIComponent(tf)+(opts.hard?'&refresh=1':''),{cache:'no-store',signal:ctl.signal});
    if(!r.ok){let detail='HTTP '+r.status;try{const j=await r.json();detail=j.detail||j.title||detail;}catch{}throw new Error(detail);}
    const d=await r.json();
    if(!d.timeframes?.[tf]?.bars?.length)throw new Error(`The data feed returned no ${tf} bars for ${sym.replace('.NS','')}`);
    chartStore.set(key,{d,fetchedAt:Date.now()});
    return {ok:true};
  }catch(e){
    if(e.name==='AbortError')return {ok:false,aborted:true};
    console.warn('[Charts] load failed',sym,tf,e.message);
    return {ok:false,error:e.message||String(e),hadData:!!hit};
  }
}

async function loadAndRender() {
  // Opening the .html file directly (file://) means fetch() can never reach a live
  // server — this is the #1 cause of "dashboard is stuck on demo data" reports. Detect
  // it up front and say so plainly, instead of letting a silent network failure look
  // identical to "you just haven't run the scanner yet".
  if (location.protocol === 'file:') {
    showBanner('Opened as a local file, so live data can\'t load. Run <code>dotnet run -- --serve</code> ' +
                'in the project folder, then open the URL it prints (e.g. http://localhost:5080) instead of this file.');
    renderAll();
    return;
  }

  try {
    const resp = await fetch('dashboard_data.json', {cache:'no-store'});
    if (resp.ok) {
      const live = await resp.json();
      applyLiveData(live);
      liveConnected = true;
      setLiveStatus(true, live.scanDate);
      hideBanner();
      console.log('[Dashboard] Loaded live data from dashboard_data.json');
    } else {
      // Surface the server's actual reason (e.g. "No scan sessions found — run the
      // scanner first") instead of quietly sitting on demo data with no explanation.
      let detail = `HTTP ${resp.status}`;
      try {
        const body = await resp.json();
        if (body && (body.detail || body.title)) detail = body.detail || body.title;
      } catch { /* non-JSON error body — keep the HTTP status */ }
      setLiveStatus(false);
      if (!liveConnected) showBanner('Dashboard server is running, but couldn\'t load data: <b>' + esc(detail) +
                                       '</b>. If you haven\'t run a scan yet, run <code>dotnet run</code> first.');
      console.warn('[Dashboard] dashboard_data.json request failed:', detail);
    }
  } catch(e) {
    setLiveStatus(false);
    if (!liveConnected) {
      showBanner('Couldn\'t reach the dashboard server at this address. Make sure ' +
                  '<code>dotnet run -- --serve</code> is running and you opened the URL it printed.');
      console.log('[Dashboard] Fetch failed — using demo data:', e.message);
    }
  }
  try { await loadChartPrefs(); } catch(e) { /* IndexedDB unavailable — defaults are fine */ }
  renderAll();
  if (chartPopupSymbol) { document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active')); document.getElementById('panel-charts')?.classList.add('active'); }
  if (chartPopupSymbol && !chartPopupInitialized) {
    chartPopupInitialized = true;
    onChartsTabShown();
  }
}

function showBanner(html) {
  const b = document.getElementById('live-banner');
  if (!b) return;
  b.innerHTML = '⚠ ' + html;
  b.style.display = 'block';
}
function hideBanner() {
  const b = document.getElementById('live-banner');
  if (b) b.style.display = 'none';
}

function setLiveStatus(ok, scanDate) {
  const tag = document.getElementById('live-source');
  if (!tag) return;
  const stamp = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if (ok) {
    tag.textContent = 'Live DB · ' + (scanDate || SCAN_DATE) + ' · updated ' + stamp;
    tag.classList.remove('badge-red');
    tag.classList.add('badge-blue');
  } else if (liveConnected) {
    // Only show a "connection lost" state once we've actually seen live data before —
    // otherwise this is just the normal demo-data fallback and shouldn't look like an error.
    tag.textContent = 'Reconnecting… last update ' + stamp;
    tag.classList.remove('badge-blue');
    tag.classList.add('badge-red');
  } else {
    tag.textContent = 'Demo data';
  }
}

function applyLiveData(live) {
  // Overwrite SESSION
  SESSION.id      = live.session.id;
  SESSION.runDate = live.session.runDate;
  SESSION.total   = live.session.total   || SESSION.total;
  SESSION.scored  = live.session.scored  || SESSION.scored;

  window.PLANS_AS_OF = live.plansAsOf || null;
  // Overwrite SCAN_DATE if present
  if (live.scanDate) window.SCAN_DATE_LIVE = live.scanDate;

  // v4.0: market regime + data-quality summary (null-safe — older server payloads won't have these)
  if (live.marketRegime) MARKET_REGIME = live.marketRegime;
  if (live.dataQuality)  DATA_QUALITY  = live.dataQuality;
  // v4.1
  if (live.sectorRotation && live.sectorRotation.length) SECTOR_ROTATION = live.sectorRotation;
  if (live.session && live.session.weightSource) WEIGHT_SOURCE = live.session.weightSource;
  // v4.2: price/volume shockers + consecutive-mover streaks — null-safe (older server
  // payloads, or a session whose scanDate lookup failed, won't have this key; keep demo
  // data rather than blanking the panels).
  if (live.shockers) SHOCKERS = live.shockers;

  // Replace STOCKS with live data
  STOCKS.length = 0;
  (live.stocks || []).forEach(s => {
    // Ensure all fields exist (backfill missing indicator fields)
    s.vcp   = s.vcp   ?? false;
    s.volR  = s.volR  ?? 1.0;
    s.adx   = s.adx   ?? 0;
    s.pdi   = s.pdi   ?? 0;
    s.mdi   = s.mdi   ?? 0;
    s.moSc  = s.moSc  ?? 0;
    s.wSc   = s.wSc   ?? 0;
    s.dSc   = s.dSc   ?? 0;
    s.hSc   = s.hSc   ?? 0;
    s.m15Sc = s.m15Sc ?? 0;
    s.m5Sc  = s.m5Sc  ?? 0;
    s.bullTf= s.bullTf?? [s.moSc,s.wSc,s.dSc,s.hSc,s.m15Sc,s.m5Sc].filter(x=>x>0).length;
    s.bearTf= s.bearTf?? 6 - s.bullTf;
    s.scores= s.scores || {st:0,hma:0,adx:0,vcp:0,vol:0,tr:0};
    s.levels= s.levels || {yH:0,yL:0,qH:0,qL:0,mH:0,mL:0,wH:0,wL:0,p52H:0,p52L:0,pMH:0,pWH:0};
    s.st    = s.st    || {bull:false,days:0,flip:'',hh:0,hhAgo:0,hl:0,hlAgo:0,lh:0,lhAgo:0,ll:0,llAgo:0};
    s.hmaFast= s.hmaFast ?? s.close;
    s.hmaSlow= s.hmaSlow ?? s.close;
    s.emaFast= s.emaFast ?? s.close;
    s.emaSlow= s.emaSlow ?? s.close;
    s.avgVol = s.avgVol  ?? 0;
    s.sector = s.sector  || '—';
    // v4.0: relative strength, liquidity, extension, ATR risk levels — default to
    // non-blocking/neutral when a server payload predates these fields.
    s.rsRank          = s.rsRank ?? 50;
    s.avgTurnover     = s.avgTurnover ?? 0;
    s.isLiquid        = s.isLiquid ?? true;
    s.extensionPct    = s.extensionPct ?? 0;
    s.isExtended      = s.isExtended ?? false;
    s.atr             = s.atr ?? 0;
    s.suggestedStop   = s.suggestedStop ?? 0;
    s.suggestedTarget = s.suggestedTarget ?? 0;
    s.gateReason      = s.gateReason ?? '';
    // v4.1: sector rotation rank + fundamentals + earnings blackout — default to neutral/unknown
    // when a server payload predates these fields, exactly like the v4.0 backfill above.
    s.sectorRank        = s.sectorRank ?? 50;
    s.fundamentals      = s.fundamentals ?? {pe:null,roePct:null,debtToEquity:null,epsGrowthPct:null,promoterPledgePct:null,hasData:false};
    s.nextEarningsDate  = s.nextEarningsDate ?? null;
    s.inEarningsBlackout= s.inEarningsBlackout ?? false;
    STOCKS.push(s);
  });
}

function renderAll() {
  BUYS.length=0;  SELLS.length=0;
  // Use the backend's own recommendation tag (rec) as the single source of truth —
  // it already applies the real BUY/SELL thresholds *and* the TopBuyCount/TopSellCount
  // ranking limits. Re-deriving a different threshold here would silently disagree
  // with what the scanner actually flagged.
  STOCKS.filter(s=>s.rec==='BUY').sort((a,b)=>b.aggScore-a.aggScore)
        .forEach((s,i)=>{ s.rank=i+1; BUYS.push(s); });
  STOCKS.filter(s=>s.rec==='IMMEDIATE_SELL').sort((a,b)=>a.aggScore-b.aggScore)
        .forEach((s,i)=>{ s.rank=i+1; SELLS.push(s); });
  renderHeader();
  renderRegimeBanner();
  renderCards();
  restoreMarketContextState();
  renderTabs();
  renderDashboard();
  renderBuys();
  renderSells();
  renderMatrix();
  renderLevels();
  renderSupertrend();
  renderShockers();
  renderStreaks();
  renderChartsPanel();
}

// ═══════════════════════════════════════════════════════════════
//  INIT  — async load then render
// ═══════════════════════════════════════════════════════════════
const BUYS=[], SELLS=[];
loadAndRender();
setInterval(loadAndRender, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
